name: Build APK

on:
  push:
    branches: [ master, main, 'arena/**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Variant to build'
        required: true
        default: 'release'
        type: choice
        options: [release, debug, both]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub-hosted Ubuntu images already ship the Android SDK; only the
      # platform/build-tools we compile against need to be present.
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          SDKMGR="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found, installing command line tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build
        run: |
          VARIANT="${{ github.event.inputs.build_type }}"
          if [ "$VARIANT" = "debug" ]; then
            gradle --no-daemon assembleDebug
          elif [ "$VARIANT" = "both" ]; then
            gradle --no-daemon assembleRelease assembleDebug
          else
            gradle --no-daemon assembleRelease
          fi

      - name: Collect artifacts
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: via-background-play-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish APK to a release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Via Background Play build ${{ github.run_number }}
          body: |
            Automatic APK build from `${{ github.sha }}` (branch `${{ github.ref_name }}`).

            ### What's inside
            - Background playback for any website, YouTube and YouTube Music included
            - Rich media notification: thumbnail, title, artist/owner, album, site name,
              previous / play-pause / next and a seek bar
            - Lock screen, headset, Bluetooth and Android Auto controls
            - In-app mini player and full player sheet

            Download the `.apk` below and install it on your phone (allow "install from
            unknown sources"). The build is signed with the standard debug key, so it
            installs directly without extra secrets.
          files: out/*.apk
          fail_on_unmatched_files: false
